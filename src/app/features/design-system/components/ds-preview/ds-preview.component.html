<div class="flex flex-col gap-2.5">
  <div class="flex flex-col gap-0.5">
    <h3 class="text-h4">{{ title() }}</h3>
    @if (description()) {
      <p class="text-body-sm text-muted-foreground max-w-3xl">{{ description() }}</p>
    }
  </div>

  <div class="bg-card rounded-xl border shadow-soft-sm">
    <div [class]="_bodyClass()">
      <ng-content />
    </div>

    @if (code()) {
      <div class="border-t">
        <div class="flex items-center justify-between gap-2 px-3 py-1.5">
          <span class="text-caption text-muted-foreground">{{ codeLabel() }}</span>
          <button
            type="button"
            class="text-muted-foreground hover:text-foreground inline-flex items-center gap-1 rounded-md px-1.5 py-1 text-caption transition-colors [&_ng-icon]:text-[length:--spacing(3.5)]"
            (click)="copy()"
          >
            <ng-icon [name]="copied() ? 'lucideCheck' : 'lucideCopy'" />
            {{ copied() ? 'คัดลอกแล้ว' : 'คัดลอก' }}
          </button>
        </div>
        <pre
          class="bg-muted/50 text-body-sm overflow-x-auto rounded-b-xl px-3 pb-3 pt-1 font-mono leading-relaxed"
        ><code>{{ code() }}</code></pre>
      </div>
    }
  </div>
</div>
